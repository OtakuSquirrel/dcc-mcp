[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp"
version = "0.1.0"
description = "Unified local daemon for agent → DCC control (Blender, Houdini, Unreal Engine, Maya)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "pillow>=11.2",
    "uvicorn>=0.29",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
dcc-mcp = "dcc_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/common/dcc_socket_server.py" = "dcc_mcp/installers/payloads/common/dcc_socket_server.py"
"plugins/blender_daemon/__init__.py" = "dcc_mcp/installers/payloads/blender_daemon/__init__.py"
"plugins/houdini_daemon/__init__.py" = "dcc_mcp/installers/payloads/houdini_daemon/__init__.py"
"plugins/maya_daemon/__init__.py" = "dcc_mcp/installers/payloads/maya_daemon/__init__.py"
"plugins/ue_daemon/__init__.py" = "dcc_mcp/installers/payloads/ue_daemon/__init__.py"

[tool.pytest.ini_options]
# plugins/common holds the vendored (non-package) DCC socket server.
pythonpath = ["plugins/common"]
testpaths = ["tests"]
