[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp"
version = "0.1.0"
description = "Agent-oriented MCP servers for DCC applications (Blender, Houdini, Unreal Engine)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "dcc-mcp-core",
    "blender-mcp",
    "houdini-mcp",
    "ue-mcp",
    "os-mcp",
]

# Workspace-level dev dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
webui = [
    "dcc-mcp-core[webui]",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dcc-mcp-core = { workspace = true }
blender-mcp = { workspace = true }
houdini-mcp = { workspace = true }
ue-mcp = { workspace = true }
os-mcp = { workspace = true }
