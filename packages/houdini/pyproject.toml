[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "houdini-mcp"
version = "0.1.0"
description = "MCP Server for SideFX Houdini — control Houdini via RPyC through the Model Context Protocol"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["houdini", "mcp", "rpyc", "3d", "vfx", "automation"]
dependencies = [
    "dcc-mcp-core>=0.1.0",
    "rpyc>=4.1,<5",
    "Pillow>=10.0",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
webui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
houdini-mcp = "houdini_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["houdini_mcp"]

[tool.uv.sources]
dcc-mcp-core = { workspace = true }
