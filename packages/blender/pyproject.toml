[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blender-mcp"
version = "0.1.0"
description = "MCP Server for Blender — control Blender via TCP+JSON through the Model Context Protocol"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["blender", "mcp", "3d", "modeling", "automation"]
dependencies = [
    "dcc-mcp-core>=0.1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
blender-mcp = "blender_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["blender_mcp"]

[tool.uv.sources]
dcc-mcp-core = { workspace = true }
