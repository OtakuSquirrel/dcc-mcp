[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "os-mcp"
version = "0.1.0"
description = "OS-level MCP tools for DCC process management, health checks, and screenshots"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "pywin32>=306; sys_platform == 'win32'",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
os-mcp = "os_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["os_mcp"]
