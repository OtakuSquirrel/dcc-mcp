[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-daemon"
version = "0.1.0"
description = "Unified local daemon that routes MCP-over-HTTP requests to registered DCC instances via a single execute_python channel."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0",
    "uvicorn>=0.29",
    "starlette>=0.37",
]

[project.scripts]
dcc-daemon = "dcc_daemon.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["dcc_daemon"]

[tool.hatch.build.targets.wheel.force-include]
"../../plugins/common/dcc_socket_server.py" = "dcc_daemon/installers/payloads/common/dcc_socket_server.py"
"../../plugins/blender_daemon/__init__.py" = "dcc_daemon/installers/payloads/blender_daemon/__init__.py"
"../../plugins/houdini_daemon/__init__.py" = "dcc_daemon/installers/payloads/houdini_daemon/__init__.py"
"../../plugins/maya_daemon/__init__.py" = "dcc_daemon/installers/payloads/maya_daemon/__init__.py"
"../../plugins/ue_daemon/__init__.py" = "dcc_daemon/installers/payloads/ue_daemon/__init__.py"

[tool.pytest.ini_options]
# plugins/common holds the vendored (non-package) DCC socket server.
pythonpath = ["../../plugins/common"]
testpaths = ["tests"]
