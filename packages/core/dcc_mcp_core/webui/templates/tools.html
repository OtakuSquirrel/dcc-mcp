{% extends "base.html" %}

{% block title %}{{ dcc_label }} Tools - DCC MCP MANAGER{% endblock %}

{% block extra_css %}
<style>
  /* ── Summary Bar ── */
  .tools-summary {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
    padding: 12px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .tools-summary-stat {
    font-size: 13px;
    color: var(--text-dim);
  }
  .tools-summary-stat strong {
    color: var(--text-bright);
    font-family: 'Cascadia Code', 'Fira Code', monospace;
  }
  .tools-summary-spacer { flex: 1; }
  .tools-summary-actions {
    display: flex;
    gap: 8px;
  }
  .tools-summary-note {
    font-size: 11px;
    color: var(--text-dim);
  }

  /* ── Grid ── */
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }

  /* ── Tile ── */
  .tool-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .tool-tile:hover {
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .tile-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .tile-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-bright);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .tile-count {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    white-space: nowrap;
  }

  .tile-desc {
    font-size: 11px;
    color: var(--text-dim);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    line-height: 1.5;
  }

  .tile-body { padding: 2px 0; }

  /* ── Tool Row ── */
  .tool-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    border-bottom: 1px solid rgba(46,49,68,0.5);
    transition: background 0.15s;
  }
  .tool-row:last-child { border-bottom: none; }
  .tool-row:hover { background: rgba(255,255,255,0.015); }

  .tool-info { flex: 1; min-width: 0; }
  .tool-name {
    font-size: 12px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    color: var(--code-text);
    line-height: 1.3;
    transition: color 0.15s, text-decoration-color 0.15s;
  }
  .tool-name.disabled {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--surface3);
  }
  .tool-desc {
    font-size: 10.5px;
    color: var(--text-dim);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Compact Toggle (32x18) ── */
  .tool-toggle {
    position: relative;
    width: 32px;
    height: 18px;
    background: var(--surface3);
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .tool-toggle.on { background: var(--green); }
  .tool-toggle::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    background: white;
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: transform 0.2s;
  }
  .tool-toggle.on::after { transform: translateX(14px); }

  @media (max-width: 768px) {
    .tools-summary { flex-wrap: wrap; }
    .tools-summary-spacer { display: none; }
    .tools-summary-actions { width: 100%; justify-content: flex-end; }
  }
</style>
{% endblock %}

{% block content %}
<!-- Summary -->
<div class="tools-summary">
  <span class="tools-summary-stat">
    <strong id="stat-enabled">0</strong> enabled &nbsp;/&nbsp;
    <strong id="stat-disabled">0</strong> disabled &nbsp;/&nbsp;
    <strong id="stat-total">0</strong> total
  </span>
  <span class="tools-summary-note">Changes take effect immediately</span>
  <div class="tools-summary-spacer"></div>
  <div class="tools-summary-actions">
    <button class="btn btn-ghost btn-sm" onclick="bulkAction('enable_all')">Enable All</button>
    <button class="btn btn-ghost btn-sm" onclick="bulkAction('disable_all')">Disable All</button>
    <button class="btn btn-accent btn-sm" onclick="resetDefaults()">Reset to Defaults</button>
  </div>
</div>

<!-- Tool Grid -->
<div class="tools-grid" id="tools-grid">
  <div class="empty-state">Loading tools...</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const DCC = '{{ dcc }}';
  let _categories = [];

  async function loadTools() {
    try {
      const data = await api(`/api/${DCC}/tools`);
      _categories = data.categories || [];
      const totalEnabled = _categories.reduce((s, c) => s + c.enabled_count, 0);
      const totalAll = _categories.reduce((s, c) => s + c.total_count, 0);
      document.getElementById('stat-enabled').textContent = totalEnabled;
      document.getElementById('stat-disabled').textContent = totalAll - totalEnabled;
      document.getElementById('stat-total').textContent = totalAll;
      renderCategories();
    } catch (err) {
      document.getElementById('tools-grid').innerHTML =
        '<div class="empty-state" style="color:var(--red);">Failed to load tools</div>';
      console.error(err);
    }
  }

  function renderCategories() {
    const grid = document.getElementById('tools-grid');
    if (_categories.length === 0) {
      grid.innerHTML = '<div class="empty-state">No tools available</div>';
      return;
    }
    grid.innerHTML = _categories.map(cat => {
      const toolRows = cat.tools.map(t => `
        <div class="tool-row">
          <div class="tool-info">
            <div class="tool-name${t.enabled ? '' : ' disabled'}">${esc(t.name)}</div>
            <div class="tool-desc">${esc(t.desc || '')}</div>
          </div>
          <div class="tool-toggle${t.enabled ? ' on' : ''}"
               onclick="toggleTool('${esc(t.name)}', ${!t.enabled})"></div>
        </div>
      `).join('');

      return `
        <div class="tool-tile">
          <div class="tile-header">
            <span class="tile-title">${esc(cat.category)}</span>
            <span class="tile-count">${cat.enabled_count}/${cat.total_count}</span>
          </div>
          ${cat.desc ? '<div class="tile-desc">' + esc(cat.desc) + '</div>' : ''}
          <div class="tile-body">${toolRows}</div>
        </div>`;
    }).join('');
  }

  async function toggleTool(name, enable) {
    try {
      await api(`/api/${DCC}/tools/toggle`, {
        method: 'PUT',
        body: JSON.stringify({ tool: name }),
      });
      showToast(`${name}: ${enable ? 'enabled' : 'disabled'}`);
      loadTools();
    } catch (err) {
      showToast('Toggle failed');
    }
  }

  async function bulkAction(action) {
    try {
      if (action === 'enable_all') {
        await api(`/api/${DCC}/tools/bulk`, {
          method: 'PUT',
          body: JSON.stringify({ disabled_tools: [] }),
        });
        showToast('All tools enabled');
      } else if (action === 'disable_all') {
        const allNames = [];
        _categories.forEach(c => c.tools.forEach(t => allNames.push(t.name)));
        await api(`/api/${DCC}/tools/bulk`, {
          method: 'PUT',
          body: JSON.stringify({ disabled_tools: allNames }),
        });
        showToast('All tools disabled');
      }
      loadTools();
    } catch (err) {
      showToast('Bulk action failed');
    }
  }

  async function resetDefaults() {
    try {
      await api(`/api/${DCC}/tools/reset`, { method: 'POST' });
      showToast('Tools reset to defaults');
      loadTools();
    } catch (err) {
      showToast('Reset failed');
    }
  }

  /* ── Init ── */
  loadTools();
</script>
{% endblock %}
