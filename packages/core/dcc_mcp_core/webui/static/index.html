<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dcc-mcp Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242736;
    --border: #2e3144;
    --text: #e4e6f0;
    --text2: #8b8fa3;
    --accent: #6366f1;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --orange: #f97316;
    --blue: #3b82f6;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header h1 span { color: var(--accent); }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .dot-green { background: var(--green); }
  .dot-yellow { background: var(--yellow); }
  .dot-red { background: var(--red); }
  .dot-gray { background: var(--text2); }
  .header-status {
    display: flex; align-items: center;
    font-size: 0.85rem; color: var(--text2);
  }

  main { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--accent); }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .card-header h2 {
    font-size: 1.1rem;
    font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .dcc-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .card-body { padding: 16px 20px; }

  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 0.88rem;
  }
  .stat-label { color: var(--text2); }
  .stat-value { font-weight: 500; font-variant-numeric: tabular-nums; }

  .session-list { margin-top: 12px; }
  .session-item {
    background: var(--surface2);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 0.82rem;
  }
  .session-item .row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
  }
  .session-item .label { color: var(--text2); }

  .verdict-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
  }
  .verdict-healthy { background: rgba(34,197,94,0.15); color: var(--green); }
  .verdict-busy { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .verdict-hung { background: rgba(239,68,68,0.15); color: var(--red); }
  .verdict-dead { background: rgba(139,143,163,0.15); color: var(--text2); }
  .verdict-unknown { background: rgba(59,130,246,0.15); color: var(--blue); }

  .btn {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); background: var(--accent); color: #fff; }
  .btn-sm { padding: 3px 10px; font-size: 0.72rem; }

  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* Tool panel */
  .tool-panel { margin-top: 12px; }
  .tool-category {
    margin-bottom: 8px;
  }
  .tool-cat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px;
    background: var(--surface2);
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 500;
  }
  .tool-cat-header:hover { background: var(--border); }
  .tool-cat-body {
    display: none;
    padding: 4px 10px;
  }
  .tool-cat-body.open { display: block; }
  .tool-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0;
    font-size: 0.78rem;
    border-bottom: 1px solid var(--border);
  }
  .tool-item:last-child { border-bottom: none; }
  .tool-name { font-family: 'Cascadia Code', 'Fira Code', monospace; }
  .tool-desc { color: var(--text2); margin-left: 8px; flex: 1; text-align: right; }

  .toggle {
    position: relative;
    width: 32px; height: 18px;
    background: var(--border);
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .toggle.on { background: var(--green); }
  .toggle::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    top: 2px; left: 2px;
    transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(14px); }

  .not-installed {
    color: var(--text2);
    font-style: italic;
    padding: 20px;
    text-align: center;
    font-size: 0.9rem;
  }

  .footer {
    text-align: center;
    padding: 16px;
    color: var(--text2);
    font-size: 0.75rem;
    border-top: 1px solid var(--border);
    margin-top: 32px;
  }

  @media (max-width: 840px) {
    .grid { grid-template-columns: 1fr; }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1><span>dcc</span>-mcp <small style="font-weight:400;color:var(--text2);font-size:0.85rem">Dashboard</small></h1>
  <div class="header-status">
    <span class="status-dot dot-green" id="live-dot"></span>
    <span id="live-label">Live</span>
  </div>
</header>

<main>
  <div class="grid" id="dcc-grid">
    <!-- Cards rendered by JS -->
  </div>
</main>

<div class="footer">dcc-mcp v0.1.0 &mdash; Agent-oriented MCP servers for Blender, Houdini, Unreal Engine</div>

<script>
const API = '';
let toolPanelData = {};

function verdictClass(v) {
  if (v === 'healthy') return 'verdict-healthy';
  if (v === 'busy') return 'verdict-busy';
  if (v === 'hung' || v === 'dead') return 'verdict-' + v;
  return 'verdict-unknown';
}

function timeSince(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

function renderCard(key, dcc) {
  const hasSession = dcc.sessions && dcc.sessions.length > 0;
  const statusDot = !dcc.installed ? 'dot-gray' :
                    hasSession ? 'dot-green' : 'dot-yellow';

  let sessionsHtml = '';
  if (hasSession) {
    sessionsHtml = '<div class="session-list">' + dcc.sessions.map(s => `
      <div class="session-item">
        <div class="row"><span class="label">Session</span><span>${s.session_id || '—'}</span></div>
        <div class="row"><span class="label">Port</span><span>${s.port} ${s.port_open ? '(open)' : '(closed)'}</span></div>
        <div class="row"><span class="label">PID</span><span>MCP: ${s.pid || '—'} / DCC: ${s.dcc_pid || '—'}</span></div>
        <div class="row"><span class="label">Client</span><span>${s.client_name || '—'}</span></div>
        <div class="row"><span class="label">Created</span><span>${timeSince(s.created_at)}</span></div>
        <div class="row"><span class="label">Status</span><span>${s.status || '—'}</span></div>
        <div class="row" style="margin-top:4px">
          <span></span>
          <button class="btn btn-sm" onclick="checkHealth('${key}', ${s.port})">Health Check</button>
        </div>
        <div id="health-${key}-${s.port}" style="margin-top:6px"></div>
      </div>
    `).join('') + '</div>';
  } else if (dcc.installed) {
    sessionsHtml = '<div style="color:var(--text2);font-size:0.85rem;padding:8px 0">No active sessions</div>';
  }

  let toolBtn = dcc.installed ? `<button class="btn btn-sm" onclick="toggleToolPanel('${key}')">Tools</button>` : '';

  return `
    <div class="card" id="card-${key}">
      <div class="card-header">
        <h2>
          <span class="status-dot ${statusDot}"></span>
          ${dcc.label}
          ${!dcc.installed ? '<span class="dcc-badge" style="background:var(--surface2);color:var(--text2)">Not installed</span>' : ''}
        </h2>
        <span style="color:${dcc.color};font-weight:700">${dcc.color === '#E87D0D' ? 'B' : dcc.color === '#FF3C00' ? 'H' : 'UE'}</span>
      </div>
      <div class="card-body">
        ${dcc.installed ? `
          <div class="stat-row"><span class="stat-label">Sessions</span><span class="stat-value">${dcc.session_count}</span></div>
          <div class="stat-row"><span class="stat-label">Tools</span><span class="stat-value">${dcc.tool_count} in ${dcc.category_count} categories</span></div>
        ` : '<div class="not-installed">Package not installed</div>'}
        ${sessionsHtml}
        <div class="actions">
          ${toolBtn}
          ${dcc.installed ? `<button class="btn btn-sm" onclick="cleanupStale('${key}')">Cleanup Stale</button>` : ''}
        </div>
        <div class="tool-panel" id="tools-${key}"></div>
      </div>
    </div>
  `;
}

function renderOverview(data) {
  const grid = document.getElementById('dcc-grid');
  grid.innerHTML = Object.entries(data)
    .filter(([k]) => k !== 'error')
    .map(([k, v]) => renderCard(k, v))
    .join('');
}

async function fetchOverview() {
  try {
    const r = await fetch(API + '/api/overview');
    const data = await r.json();
    renderOverview(data);
  } catch (e) {
    console.error('Failed to fetch overview:', e);
  }
}

async function checkHealth(dcc, port) {
  const el = document.getElementById(`health-${dcc}-${port}`);
  if (!el) return;
  el.innerHTML = '<span style="color:var(--text2);font-size:0.75rem">Checking...</span>';
  try {
    const r = await fetch(`${API}/api/health/${dcc}/${port}`);
    const h = await r.json();
    el.innerHTML = `
      <span class="verdict-badge ${verdictClass(h.verdict)}">${h.verdict}</span>
      <span style="font-size:0.72rem;color:var(--text2);margin-left:6px">${h.details || ''}</span>
      ${h.cpu_percent != null ? `<br><span style="font-size:0.72rem;color:var(--text2)">CPU: ${h.cpu_percent}%</span>` : ''}
    `;
  } catch (e) {
    el.innerHTML = '<span style="color:var(--red);font-size:0.75rem">Error</span>';
  }
}

async function cleanupStale(dcc) {
  try {
    const r = await fetch(`${API}/api/actions/${dcc}/cleanup`, { method: 'POST' });
    const d = await r.json();
    alert(`Cleaned ${d.count} stale session(s)`);
    fetchOverview();
  } catch (e) {
    alert('Cleanup failed: ' + e);
  }
}

async function toggleToolPanel(dcc) {
  const el = document.getElementById(`tools-${dcc}`);
  if (!el) return;
  if (el.innerHTML.trim()) {
    el.innerHTML = '';
    openToolPanels.delete(dcc);
    return;
  }
  openToolPanels.add(dcc);
  try {
    const r = await fetch(`${API}/api/tools/${dcc}`);
    const data = await r.json();
    if (data.error) { el.innerHTML = `<div class="not-installed">${data.error}</div>`; return; }
    toolPanelData[dcc] = data;
    renderToolPanel(dcc, data);
  } catch (e) {
    el.innerHTML = '<div class="not-installed">Failed to load tools</div>';
  }
}

function renderToolPanel(dcc, data) {
  const el = document.getElementById(`tools-${dcc}`);
  if (!el) return;
  let html = '';
  for (const [catName, catInfo] of Object.entries(data.categories)) {
    const tools = Object.entries(catInfo.tools);
    const enabledCount = tools.filter(([,t]) => t.enabled).length;
    html += `
      <div class="tool-category">
        <div class="tool-cat-header" onclick="this.nextElementSibling.classList.toggle('open')">
          <span>${catName} <span style="color:var(--text2)">(${enabledCount}/${tools.length})</span></span>
          <span style="color:var(--text2);font-size:0.75rem">${catInfo.description}</span>
        </div>
        <div class="tool-cat-body">
          ${tools.map(([name, t]) => `
            <div class="tool-item">
              <span class="tool-name">${name}</span>
              <span class="tool-desc">${t.description}</span>
              <div class="toggle ${t.enabled ? 'on' : ''}" onclick="toggleTool('${dcc}','${name}',this)"></div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
  el.innerHTML = html;
}

async function toggleTool(dcc, tool, el) {
  try {
    const r = await fetch(`${API}/api/tools/${dcc}/${tool}/toggle`, { method: 'POST' });
    const d = await r.json();
    if (d.enabled) { el.classList.add('on'); } else { el.classList.remove('on'); }
  } catch (e) {
    console.error('Toggle failed:', e);
  }
}

// Track which tool panels are open so SSE re-renders don't wipe them
let openToolPanels = new Set();

// SSE live updates — only re-render if no tool panel is open
function connectSSE() {
  const es = new EventSource(API + '/api/events');
  es.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (!data.error && openToolPanels.size === 0) renderOverview(data);
      document.getElementById('live-dot').className = 'status-dot dot-green';
      document.getElementById('live-label').textContent = 'Live';
    } catch {}
  };
  es.onerror = () => {
    document.getElementById('live-dot').className = 'status-dot dot-red';
    document.getElementById('live-label').textContent = 'Disconnected';
  };
}

// Init
fetchOverview();
connectSSE();
</script>
</body>
</html>
