[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-core"
version = "0.1.0"
description = "Shared core library for DCC MCP servers — config, registry, connection, middleware, health"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
webui = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
