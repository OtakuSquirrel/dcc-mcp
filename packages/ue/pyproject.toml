[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ue-mcp"
version = "0.1.0"
description = "MCP Server for Unreal Engine — control UE via Python Remote Execution through the Model Context Protocol"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["unreal", "ue5", "mcp", "3d", "game-dev", "automation"]
dependencies = [
    "dcc-mcp-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ue-mcp = "ue_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ue_mcp"]

[tool.uv.sources]
dcc-mcp-core = { workspace = true }
